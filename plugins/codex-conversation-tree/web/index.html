<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话树</title><style>
:root{font-family:"Segoe UI",Inter,"Microsoft YaHei",sans-serif;color:#25303d;background:#f6f8fb;--line:#dce2ea;--muted:#7c8898;--blue:#397bc9;--shadow:0 8px 25px rgba(29,47,71,.09)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}[hidden]{display:none!important}
.app{height:100vh;min-height:520px;display:grid;grid-template-columns:244px minmax(0,1fr) 0;grid-template-rows:62px minmax(0,1fr)}.app.has-detail{grid-template-columns:244px minmax(0,1fr) 360px}.topbar{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:5}.brand{min-width:224px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750}.mark{width:27px;height:27px;border:2px solid var(--blue);border-radius:8px;color:var(--blue);display:grid;place-items:center;font:700 17px Consolas,monospace}.divider{height:22px;border-left:1px solid var(--line)}.page-title{font-size:13px;font-weight:700}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.top-actions{margin-left:auto;display:flex;gap:8px}.btn,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;color:#4b596a;padding:8px 11px;font-size:11px;font-weight:650}.btn:hover,.icon-btn:hover{border-color:#a9bfdc;color:var(--blue)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.icon-btn{width:32px;height:32px;padding:0;font-size:16px}
.sidebar{grid-row:2;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.sidebar-top{padding:19px 13px 10px}.eyebrow,.section-label{font:700 10px Consolas,monospace;letter-spacing:.12em;color:#97a2b0;text-transform:uppercase}.eyebrow{margin-bottom:11px}.section-label{padding:12px 14px 8px}.search{height:35px;width:100%;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#f9fafc;font-size:11px}.session-list{padding:0 8px 15px;overflow:auto;flex:1}.session-item{width:100%;display:flex;gap:9px;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:10px 8px;color:#4b5868;margin-bottom:3px}.session-item:hover{background:#f4f7fb}.session-item.active{background:#ebf3ff;border-color:#d8e7f9;color:#2464ac}.session-icon{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:7px;background:#e7eef8;color:#567fac;font-size:12px}.session-item.demo .session-icon{background:#eee8fa;color:#8063b5}.session-copy{min-width:0}.session-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700}.session-meta{display:block;font:10px Consolas,monospace;color:#9aa5b2;margin-top:4px}.sidebar-footer{padding:11px 15px;border-top:1px solid var(--line);font-size:10px;color:#9aa5b2}
.main{grid-row:2;min-width:0;min-height:0;position:relative}.viewport{width:100%;height:100%;position:relative;overflow:hidden;cursor:grab;background-color:#f8fafd;background-image:radial-gradient(#dce3ec 1px,transparent 1px);background-size:24px 24px}.viewport.dragging{cursor:grabbing}.scene{position:absolute;left:0;top:0;transform-origin:0 0}.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}.wire{fill:none;stroke:#bdc9d8;stroke-width:2}.wire.branch{stroke:#80a8dc;stroke-width:2.5}.canvas-toolbar{position:absolute;top:17px;left:19px;right:19px;z-index:3;display:flex;align-items:flex-start;gap:8px;pointer-events:none}.canvas-toolbar>*{pointer-events:auto}.canvas-label,.toolbar-group{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.canvas-label{padding:10px 13px;min-width:175px}.canvas-label strong{display:block;font-size:12px}.canvas-label span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.spacer{flex:1}.toolbar-group{display:flex;align-items:center;gap:3px;padding:4px}.tool{border:0;background:transparent;min-width:27px;height:27px;border-radius:6px;color:#5b6b7e;font-size:13px;font-weight:700}.tool:hover{background:#ecf4ff;color:var(--blue)}.tool.wide{padding:0 8px;font-size:10px}.zoom-label{font:10px Consolas,monospace;color:#7a8898;min-width:35px;text-align:center}.canvas-hint{position:absolute;bottom:15px;left:19px;color:#9ca8b5;font-size:10px;pointer-events:none}.empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;max-width:300px;text-align:center;color:#778494;font-size:12px;line-height:1.6}
.node{position:absolute;width:286px;height:146px;border:1px solid #d6e0ea;border-radius:12px;background:#fff;box-shadow:0 5px 15px rgba(39,61,88,.07);padding:13px 14px;text-align:left;color:#25303d;transition:border-color .15s,box-shadow .15s,transform .15s}.node:hover{border-color:#8fb7e5;box-shadow:0 10px 25px rgba(44,94,153,.14);transform:translateY(-2px)}.node.selected{border-color:var(--blue);box-shadow:0 0 0 3px #dcecff,0 9px 22px rgba(44,94,153,.12)}.node-top,.node-bottom{display:flex;align-items:center;gap:7px}.node-index,.node-kind,.node-status,.node-bottom{font:10px Consolas,monospace}.node-index{color:#96a1ae}.node-kind{font-weight:700;color:#3c7cc2}.node.branch .node-kind{color:#8263b2}.node-status{margin-left:auto;background:#edf3fa;color:#6583a7;padding:3px 5px;border-radius:5px}.node-question{font-size:12px;font-weight:720;line-height:1.45;margin:10px 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.node-answer{font-size:11px;color:#718091;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.node-bottom{border-top:1px solid #eef1f5;margin-top:10px;padding-top:8px;color:#9aa6b2}.node-bottom .branch-count{margin-left:auto;color:#7193bd}.branch-pill{position:absolute;min-width:155px;max-width:220px;border:1px solid #bdd3ee;border-radius:9px;background:#eaf3ff;color:#316cab;padding:9px 10px;box-shadow:0 4px 12px rgba(48,92,146,.08);text-align:left;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.branch-pill:hover{background:#dcecff}.branch-pill small{color:#819fc3;font:10px Consolas,monospace;margin-left:5px}
.detail{grid-column:3;grid-row:2;min-height:0;background:#fff;border-left:1px solid var(--line);display:none;flex-direction:column}.has-detail .detail{display:flex}.detail-head{display:flex;gap:10px;align-items:flex-start;padding:20px;border-bottom:1px solid var(--line)}.detail-title{font-size:14px;font-weight:750;line-height:1.4;flex:1}.detail-body{overflow:auto;padding:20px}.detail-block{margin-bottom:23px}.detail-role{font:700 10px Consolas,monospace;letter-spacing:.1em;color:#8d9bab;margin-bottom:9px}.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.75;color:#445264}.detail-id{font:10px/1.6 Consolas,monospace;color:#9aa5b2;overflow-wrap:anywhere;border-top:1px solid #edf0f4;padding-top:14px}.detail-foot{border-top:1px solid var(--line);padding:14px 20px;color:#9ca6b2;font-size:10px}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:8;background:#253b55;color:white;padding:9px 13px;border-radius:8px;font-size:11px}
@media(max-width:900px){.app,.app.has-detail{grid-template-columns:190px minmax(0,1fr)}.brand{min-width:170px}.detail{position:absolute;right:0;top:62px;bottom:0;width:min(360px,75vw);z-index:6;box-shadow:-12px 0 30px rgba(30,45,65,.1)}}@media(max-width:600px){.app,.app.has-detail{grid-template-columns:1fr}.sidebar{display:none}.brand{min-width:0}.subtitle,.tool.wide{display:none}.canvas-toolbar{left:9px;right:9px;top:9px}.canvas-label{min-width:0}.canvas-label span{display:none}.detail{width:88vw}}@media(prefers-reduced-motion:reduce){.node{transition:none}}
.demo-form{display:flex;flex-direction:column;gap:8px}.demo-form input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:11px}.demo-form .btn{align-self:flex-start}.composer{position:absolute;left:18px;right:18px;bottom:18px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}.composer-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-bottom:7px}.composer-head span{color:var(--muted)}.composer form{display:flex;align-items:flex-end;gap:9px}.composer textarea{flex:1;min-width:0;resize:vertical;max-height:120px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px;line-height:1.5;font-family:inherit}.composer-actions{display:flex;gap:6px}.live-answer{max-height:110px;overflow:auto;white-space:pre-wrap;font-size:11px;line-height:1.5;color:#445264;border-bottom:1px solid var(--line);padding:5px 0 9px;margin-bottom:8px}.approval-panel{border:1px solid #efcf91;background:#fff9ea;border-radius:8px;padding:8px;margin-bottom:8px;font-size:11px}.approval-panel button{margin:6px 6px 0 0}.branch-pill.selected{outline:2px solid var(--blue)}</style></head><body><div class="app" id="shell"><header class="topbar"><div class="brand"><div class="mark">⌁</div>Conversation Tree</div><div class="divider"></div><div><div class="page-title" id="page-title">会话地图</div><div class="subtitle" id="page-subtitle">沿着问题，探索每一条思路</div></div><div class="top-actions"><button class="btn" id="show-demo">查看示例</button><button class="btn primary" id="show-real">真实会话</button></div></header><aside class="sidebar"><div class="sidebar-top"><div class="eyebrow">你的会话</div><input id="session-search" class="search" type="search" placeholder="搜索会话…" aria-label="搜索会话"></div><div class="section-label">探索</div><div class="session-list" id="session-list"></div><div class="sidebar-footer" id="sidebar-footer">正在读取会话…</div></aside><main class="main"><div class="canvas-toolbar"><div class="canvas-label"><strong id="canvas-name">示例会话</strong><span id="canvas-meta">多级分支 · 演示数据</span></div><div class="spacer"></div><div class="toolbar-group"><button class="tool wide" id="collapse-all">收起分支</button><button class="tool wide" id="expand-all">全部展开</button></div><div class="toolbar-group"><button class="tool" id="zoom-out" aria-label="缩小">−</button><span class="zoom-label" id="zoom-label">100%</span><button class="tool" id="zoom-in" aria-label="放大">+</button><button class="tool wide" id="fit-view">适配</button></div></div><div class="viewport" id="viewport"><div class="scene" id="scene"><svg class="wires" id="wires"></svg><div id="nodes"></div></div><div class="canvas-hint">拖动画布 · 滚轮缩放 · 点击卡片查看完整内容</div><div class="empty" id="empty" hidden></div></div><div class="composer" id="composer" hidden><div class="composer-head"><strong id="composer-target"></strong><span id="composer-status"></span></div><div class="live-answer" id="live-answer" hidden></div><div class="approval-panel" id="approval-panel" hidden></div><form id="composer-form"><textarea id="composer-input" placeholder="继续这条会话…" aria-label="继续会话"></textarea><div class="composer-actions"><button class="btn" type="button" id="stop-turn" hidden>停止</button><button class="btn primary" type="submit" id="send-turn">发送 ↗</button></div></form></div></main><aside class="detail"><div class="detail-head"><div class="detail-title" id="detail-title"></div><button class="icon-btn" id="close-detail" aria-label="关闭详情">×</button></div><div class="detail-body" id="detail-body"></div><div class="detail-foot">树上每张卡片对应一个完整 Turn</div></aside></div><div class="toast" id="toast" hidden></div><script type="module">/* BUNDLE */</script></body></html>
